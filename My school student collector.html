<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Student Collector</title>
</head>
<form>
<body>
    <h2><b>Student data collection app</b></h2>
    <input type="text" id="studentName" placeholder="Enter student full name">
    <input type="number" id="studentAge" placeholder="Enter student age">
    <input type="email" id="studentEmail" placeholder="Enter student email">
    <input type="text" id="studentGrade" placeholder="Enter student grade">
    <input type="text" id="studentID" placeholder="Enter student ID">
    <input type="text" id="studentDateOfBirth" placeholder="Enter student date of birth">
    <input type="number" id="studentPhoneNumber" placeholder="Enter student phone number">
    <input type="text" id="studentCity" placeholder="Enter student city">
    <input type="text" id="studentGender" placeholder="Enter student gender">
    <button type="submit">Submit</button>    
    </form>
    <script>
   document.querySelector("form").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("studentName").value;
    const age = document.getElementById("studentAge").value;
    const email = document.getElementById("studentEmail").value;
    const grade = document.getElementById("studentGrade").value;
    const studentID = document.getElementById("studentID").value;
    const dateOfBirth = document.getElementById("studentDateOfBirth").value;
    const phoneNumber = document.getElementById("studentPhoneNumber").value;
    const city = document.getElementById("studentCity").value;
    const gender = document.getElementById("studentGender").value;

    console.log(name, age, email, grade, studentID, dateOfBirth, phoneNumber, city, gender);
    alert("Student information submitted successfully!");
});
    </script>
</body>
</html>
