<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Student collector website</title>
</head>
<body>
    <style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f0f4f8;
    margin: 0;
    padding: 30px 15px;
    color: #243247;
    }
    h2 {
    text-align: center;
    color: #1457b8;
    margin-bottom: 25px;
}

form {
    background-color: white;
    max-width: 450px;
    margin: 0 auto;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

input {
    width: 100%;
    padding: 11px;
    margin-bottom: 18px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 4px rgba(37, 99, 235, 0.3);
}

button {
    width: 100%;
    padding: 12px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background-color: #1749b0;
}
</style>
<body>

     <h2>Student Data Collection App</h2>
    <form>
        <label for="studentName">Full Name:</label>
        <input type="text" id="studentName" placeholder="Enter student full name" required>
            <br><br>

        <label for="studentAge">Age:</label>
        <input type="number" id="studentAge" placeholder="Enter student age" min="5" max="35" required>
        <br><br>

        <label for="studentEmail">Email:</label>
        <input type="email" id="studentEmail" placeholder="Enter student email" required>
        <br><br>

        <label for="studentGrade">Class:</label>
        <input type="text" id="studentGrade" placeholder="Enter student class" required>
        <br><br>

        <label for="studentID">Student ID:</label>
        <input type="text" id="studentID" placeholder="Enter student ID" minlength="4" maxlength="10" required>
        <br><br>

        <label for="studentDateOfBirth">Date of Birth:</label>
        <input type="date" id="studentDateOfBirth" max="2026-10-09" required>
        <br><br>

        <label for="studentPhoneNumber">Phone Number:</label>
        <input type="tel" id="studentPhoneNumber" placeholder="Enter phone number" required>
        <br><br>

        <label for="studentCity">City:</label>
        <input type="text" id="studentCity" placeholder="Enter student city" required>
        <br><br>

        <select id="studentGender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <script>
        document.querySelector("form").addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("studentName").value;
            const age = document.getElementById("studentAge").value;
            const email = document.getElementById("studentEmail").value;
            const grade = document.getElementById("studentGrade").value;
            const studentID = document.getElementById("studentID").value;
            const dateOfBirth = document.getElementById("studentDateOfBirth").value;
            const phoneNumber = document.getElementById("studentPhoneNumber").value;
            const city = document.getElementById("studentCity").value;
            const gender = document.getElementById("studentGender").value;

            console.log(
                name,
                age,
                email,
                grade,
                studentID,
                dateOfBirth,
                phoneNumber,
                city,
                gender
            );

            alert("Student information submitted successfully!");
        });
